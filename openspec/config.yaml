schema: spec-driven

# Contexto del proyecto (se usa al crear artefactos con OpenSpec / IA).
# Mantener alineado con openspec/README.md y openspec/specs/*/spec.md
context: |
  Repositorio: LuminaWriters (monorepo ligero).

  Código de aplicación:
  - Todo el proyecto Flutter vive en la carpeta `app/` (paquete `lumina_writers`).
  - No hay pubspec en la raíz del repo; ejecutar comandos Flutter desde `app/`.
  - Plataformas: Android y web. Tema: Material 3, Dart SDK ^3.11.4.

  Documentación de producto y cliente:
  - `openspec/specs/product/spec.md` — visión y alcance.
  - `openspec/specs/client/spec.md` — rutas, pantallas y convenciones Flutter.

  Flujo OpenSpec:
  - Cambios nuevos bajo `openspec/changes/<nombre>/` (proposal, design, tasks).
  - Specs estables bajo `openspec/specs/<capability>/spec.md`.
  - Comandos Cursor: `.cursor/commands/opsx-*.md` (propose, apply, explore, archive).

  Commits: mensajes claros; convención tipo Conventional Commits frecuente (feat/fix/docs/chore).

